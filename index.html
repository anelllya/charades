<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17142B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Charades Free">
<title>Charades Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: home = settings strip + category tile grid; game = full-screen stage with big word, tap halves, color flashes */
:root{
  --ink:#17142B; --ink2:#221D3F; --line:#3B3463; --paper:#FFF6E8; --muted:#B5AED4;
  --sun:#FFC53D; --good:#1FC47D; --pass:#FF6B3D;
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:22px}

/* Brand */
.brand{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,76px);line-height:.9;margin:0;letter-spacing:-.01em}
.stamp{font-family:var(--display);background:var(--sun);color:var(--ink);font-size:clamp(18px,4.6vw,28px);padding:6px 12px 4px;border-radius:6px;transform:rotate(-6deg) translateY(-6px);display:inline-block}
.tag{margin:0;color:var(--muted);max-width:52ch;line-height:1.45}

/* Settings */
.settings{display:flex;flex-wrap:wrap;gap:14px 20px}
.set{display:flex;flex-direction:column;gap:6px}
.set>span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

/* Grid */
.sectionhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sectionhead h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sectionhead small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;text-align:left;border:0;border-radius:18px;padding:16px 14px 14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;color:var(--ink);background:var(--c);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.08;text-wrap:balance}
.tile .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;opacity:.8;gap:6px}
.tile .sub{font-size:12px;font-weight:600;opacity:.75;line-height:1.3}
.kid{background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 8px;font-size:11px;opacity:1}
.tile.dashed{background:transparent;color:var(--paper);border:2px dashed var(--line)}
.tile .edit{position:absolute;top:8px;right:8px;border:0;background:var(--ink2);color:var(--paper);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}

.foot{color:var(--muted);font-size:13px;line-height:1.5;max-width:60ch}

/* Game */
.game{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ink);transition:background-color .15s;z-index:5;touch-action:manipulation}
.game.good{background:var(--good)}
.game.passed{background:var(--pass)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:max(10px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));position:relative;z-index:2}
.hud .time{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;min-width:2.2ch}
.hud .time.low{color:var(--sun)}
.hud .cat{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game.good .hud .cat,.game.passed .hud .cat{color:var(--ink)}
.hud .right{display:flex;align-items:center;gap:12px}
.hud .score{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.quit{border:0;background:rgba(255,255,255,.12);border-radius:999px;width:38px;height:38px;font-size:18px;line-height:1}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px max(20px,env(safe-area-inset-right)) 8px max(20px,env(safe-area-inset-left));text-align:center;overflow:hidden}
.word{font-family:var(--display);font-weight:400;line-height:1.02;text-wrap:balance;max-width:100%;overflow-wrap:normal;word-break:normal;hyphens:none}
.hint{text-align:center;color:var(--muted);font-size:13px;padding-bottom:max(12px,env(safe-area-inset-bottom));padding-left:16px;padding-right:16px;position:relative;z-index:2}
.game.good .hint,.game.passed .hint{color:var(--ink)}
.zones{position:absolute;inset:0;display:flex;z-index:1}
.zones button{flex:1;border:0;background:transparent}
.zones button:active{background:rgba(255,255,255,.06)}
.notice{background:var(--sun);color:var(--ink);font-weight:600;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.4;margin:0 16px}

/* Results */
.score-big{display:flex;align-items:baseline;gap:14px}
.score-big b{font-family:var(--display);font-weight:400;font-size:clamp(80px,22vw,140px);line-height:.9;color:var(--sun)}
.score-big span{font-size:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:10px;font-weight:600;font-size:15px}
.chip.ok{background:var(--good);color:var(--ink)}
.chip.no{background:var(--ink2);color:var(--muted);border:1px solid var(--line);text-decoration:line-through;text-decoration-thickness:1px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-size:16px;background:var(--paper);color:var(--ink)}
.btn.alt{background:transparent;color:var(--paper);border:2px solid var(--line)}

/* Custom words sheet */
.sheet{position:fixed;inset:0;background:rgba(10,8,25,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .panel{background:var(--ink2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:20px max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--display);font-weight:400;margin:0;font-size:22px}
.sheet p{margin:0;color:var(--muted)}
.sheet textarea{width:100%;min-height:220px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--paper);font:16px/1.5 var(--body);padding:12px;resize:vertical;-webkit-user-select:text;user-select:text}

@media (prefers-reduced-motion:reduce){.tile,.game{transition:none}}
</style>
</head>
<body>

<!-- HOME -->
<main id="home" class="wrap">
  <div class="brand"><h1>Charades</h1><span class="stamp">FREE</span></div>
  <p class="tag" data-t="tagline"></p>

  <div class="settings">
    <div class="set"><span data-t="lang"></span>
      <div class="seg" id="segLang"><button data-v="en">English</button><button data-v="es">Español</button></div></div>
    <div class="set"><span data-t="round"></span>
      <div class="seg" id="segTime"><button data-v="30">30s</button><button data-v="60">60s</button><button data-v="90">90s</button></div></div>
    <div class="set"><span data-t="controls"></span>
      <div class="seg" id="segCtl"><button data-v="tilt" data-t="tilt"></button><button data-v="tap" data-t="tap"></button></div></div>
    <div class="set"><span data-t="who"></span>
      <div class="seg" id="segKids"><button data-v="all" data-t="everyone"></button><button data-v="kids" data-t="kidsOnly"></button></div></div>
  </div>

  <div class="sectionhead"><h2 data-t="pick"></h2><small id="count"></small></div>
  <div class="grid" id="grid"></div>

  <p class="foot" data-t="foot"></p>
</main>

<!-- GAME -->
<section id="game" class="game" hidden>
  <div class="zones" id="zones"><button id="zPass" aria-label="Pass"></button><button id="zGood" aria-label="Correct"></button></div>
  <div class="hud">
    <div class="time" id="time">60</div>
    <div class="cat" id="gcat"></div>
    <div class="right"><div class="score" id="gscore">0</div><button class="quit" id="quit" aria-label="Quit">✕</button></div>
  </div>
  <p class="notice" id="notice" hidden></p>
  <div class="stage" id="stage"><div class="word" id="word"></div></div>
  <div class="hint" id="hint"></div>
</section>

<!-- RESULTS -->
<main id="results" class="wrap" hidden>
  <div class="score-big"><b id="rscore">0</b><span id="rlabel"></span></div>
  <div class="chips" id="chips"></div>
  <div class="actions">
    <button class="btn" id="again" data-t="again"></button>
    <button class="btn alt" id="back" data-t="cats"></button>
  </div>
</main>

<!-- CUSTOM WORDS -->
<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <h3 data-t="customTitle"></h3>
    <p data-t="customDesc"></p>
    <textarea id="customText" spellcheck="false"></textarea>
    <div class="actions"><button class="btn" id="saveCustom" data-t="save"></button><button class="btn alt" id="cancelCustom" data-t="cancel"></button></div>
  </div>
</div>

/* ---------- State ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem("cf_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("cf_"+k,JSON.stringify(v))}catch(e){}}
};
const S = {
  lang: store.get("lang", (navigator.language||"en").toLowerCase().startsWith("es")?"es":"en"),
  time: store.get("time", 60),
  ctl: store.get("ctl", "tilt"),
  who: store.get("who", "all"),
  custom: store.get("custom", "")
};
const used = {}; // per category+lang, words already shown this session
let G = null;    // current game

const $ = id => document.getElementById(id);
const t = k => T[S.lang][k];
const words = s => s.split("|");
const customWords = () => S.custom.split("\n").map(x=>x.trim()).filter(Boolean);
const visibleCats = () => C.filter(c => S.who==="all" || c.kids);

/* ---------- Home ---------- */
function renderText(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v=t(el.dataset.t); if(typeof v==="string") el.textContent=v; });
}
function renderSegs(){
  const map = {segLang:"lang",segTime:"time",segCtl:"ctl",segKids:"who"};
  for (const id in map) $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v)===String(S[map[id]])));
}
function tile(opts){
  const b=document.createElement("button");
  b.className="tile"+(opts.dashed?" dashed":"");
  if(opts.color) b.style.setProperty("--c",opts.color);
  const name=document.createElement("b"); name.textContent=opts.name; b.appendChild(name);
  if(opts.sub){const s=document.createElement("div");s.className="sub";s.textContent=opts.sub;b.appendChild(s)}
  const m=document.createElement("div"); m.className="meta";
  const n=document.createElement("span"); n.textContent=opts.count+" "+t("words"); m.appendChild(n);
  if(opts.kid){const k=document.createElement("span");k.className="kid";k.textContent=t("kid");m.appendChild(k)}
  b.appendChild(m);
  b.addEventListener("click", opts.onClick);
  return b;
}
function renderGrid(){
  const g=$("grid"); g.textContent="";
  const cats=visibleCats();
  const mixCount=cats.reduce((n,c)=>n+words(c["w_"+S.lang]).length,0);
  g.appendChild(tile({name:t("mix"),sub:t("mixSub"),count:mixCount,color:"#FFF6E8",onClick:()=>start("mix")}));
  cats.forEach(c=>{
    const [name,sub]=c[S.lang];
    g.appendChild(tile({name,sub,count:words(c["w_"+S.lang]).length,color:c.c,kid:c.kids&&S.who==="all",onClick:()=>start(c.id)}));
  });
  const cw=customWords();
  const ct=tile({name:t("custom"),sub:t("customSub"),count:cw.length,dashed:true,onClick:()=>cw.length?start("custom"):openSheet()});
  const e=document.createElement("span"); e.className="edit"; e.textContent=t("edit"); e.setAttribute("role","button");
  e.addEventListener("click",ev=>{ev.stopPropagation();openSheet()});
  ct.appendChild(e); g.appendChild(ct);
  $("count").textContent=T[S.lang].count(cats.length+2);
}
function renderHome(){renderText();renderSegs();renderGrid()}

function bindSeg(id,key,num){
  $(id).addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    S[key]=num?Number(b.dataset.v):b.dataset.v; store.set(key,S[key]); renderHome();
  });
}
bindSeg("segLang","lang"); bindSeg("segTime","time",true); bindSeg("segCtl","ctl"); bindSeg("segKids","who");

/* Custom sheet */
function openSheet(){ $("customText").value=S.custom; $("sheet").hidden=false; setTimeout(()=>$("customText").focus(),50); }
$("cancelCustom").onclick=()=>{$("sheet").hidden=true};
$("saveCustom").onclick=()=>{S.custom=$("customText").value; store.set("custom",S.custom); $("sheet").hidden=true; renderGrid();};

/* ---------- Deck ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deckFor(id){
  let pool;
  if(id==="custom") pool=customWords();
  else if(id==="mix") pool=visibleCats().flatMap(c=>words(c["w_"+S.lang]));
  else pool=words(C.find(c=>c.id===id)["w_"+S.lang]);
  const key=id+"|"+S.lang+"|"+S.who;
  used[key]=used[key]||new Set();
  let fresh=pool.filter(w=>!used[key].has(w));
  if(fresh.length<8){used[key].clear();fresh=pool.slice()}
  return {key,list:shuffle(fresh)};
}
function catName(id){
  if(id==="mix") return t("mix");
  if(id==="custom") return t("custom");
  return C.find(c=>c.id===id)[S.lang][0];
}

/* ---------- Sound, vibration, wake lock ---------- */
let AC=null, wake=null;
function audioInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function beep(freq,dur,type,vol){
  if(!AC) return;
  try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.18,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}catch(e){}
}
const buzz = p => { try{navigator.vibrate&&navigator.vibrate(p)}catch(e){} };
async function wakeOn(){try{wake=await navigator.wakeLock.request("screen")}catch(e){wake=null}}
function wakeOff(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener("visibilitychange",()=>{if(G&&document.visibilityState==="visible")wakeOn()});

/* ---------- Motion ----------
   z = how much the screen faces up (1), sideways (0) or down (-1).
   Phone on forehead: screen sideways. Nod down: screen faces floor = correct. Look up: faces ceiling = pass. */
let motionOK=false, motionListening=false, z=0, needNeutral=true;
function onOrient(e){
  if(e.beta==null||e.gamma==null) return;
  motionOK=true;
  const b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180;
  z=Math.cos(b)*Math.cos(g);
  if(!G||G.phase!=="play") { if(Math.abs(z)<.35) needNeutral=false; return; }
  if(Math.abs(z)<.35){needNeutral=false;return}
  if(needNeutral) return;
  if(z<-.6) mark(true); else if(z>.6) mark(false);
}
async function motionInit(){
  // Must run inside a tap on iOS
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=="granted") return "denied";
    }
  }catch(e){return "denied"}
  if(!motionListening){window.addEventListener("deviceorientation",onOrient);motionListening=true}
  return "ok";
}

/* ---------- Game ---------- */
async function start(id){
  if(id==="custom"&&!customWords().length){openSheet();return}
  audioInit();
  let notice="";
  if(S.ctl==="tilt"){ const r=await motionInit(); if(r==="denied") notice=t("denied"); }
  const d=deckFor(id);
  G={id,deck:d.list,key:d.key,i:-1,results:[],phase:"count",endAt:0,tick:null,tiltWanted:S.ctl==="tilt"&&!notice};
  wakeOn();
  try{ if(document.documentElement.requestFullscreen&&/Android/i.test(navigator.userAgent)){await document.documentElement.requestFullscreen();await screen.orientation.lock("landscape")} }catch(e){}
  $("home").hidden=true; $("results").hidden=true; $("game").hidden=false;
  $("gcat").textContent=catName(id); $("gscore").textContent="0"; $("time").textContent=S.time; $("time").classList.remove("low");
  $("hint").textContent=G.tiltWanted?t("tiltHint"):t("tapHint");
  $("notice").textContent=notice; $("notice").hidden=!notice;
  countdown(3);
  if(G.tiltWanted) setTimeout(()=>{ if(G&&!motionOK){ G.tiltWanted=false; $("notice").textContent=t("noMotion"); $("notice").hidden=false; $("hint").textContent=t("tapHint"); } },1500);
}
function showWord(text,small){
  const w=$("word"); w.textContent=text; w.dataset.small=small?"1":""; fit();
}
function fit(){
  const w=$("word"), box=$("stage"); if(!w.textContent) return;
  let s=Math.min(box.clientWidth*.22, box.clientHeight*.62);
  if(w.dataset.small) s*=.6;
  w.style.fontSize=s+"px"; let i=0;
  while((w.scrollWidth>box.clientWidth-8||w.scrollHeight>box.clientHeight-8)&&i<80){s*=.93;w.style.fontSize=s+"px";i++}
}
window.addEventListener("resize",()=>{ if(G) fit(); });

function countdown(n){
  if(!G) return;
  if(n===0){ play(); return; }
  showWord(n===3?t("forehead"):String(n), n===3);
  if(n<3) beep(520,.12,"square",.12);
  G.cd=setTimeout(()=>countdown(n-1), n===3?1800:900);
}
function play(){
  G.phase="play"; needNeutral=true;
  G.endAt=Date.now()+S.time*1000;
  beep(880,.18,"square",.14);
  next();
  G.tick=setInterval(tick,200);
}
function next(){
  if(!G.deck.length){ const d=deckFor(G.id); G.deck=d.list; }
  G.i++;
  if(G.i>=G.deck.length){ G.deck=G.deck.concat(shuffle(G.deck.slice())); }
  showWord(G.deck[G.i]);
}
function tick(){
  if(!G) return;
  const left=Math.max(0,Math.ceil((G.endAt-Date.now())/1000));
  const el=$("time");
  if(el.textContent!==String(left)){ el.textContent=left; if(left<=10&&left>0){el.classList.add("low");beep(660,.06,"sine",.08)} }
  if(left<=0) finish();
}
function mark(ok){
  if(!G||G.phase!=="play") return;
  const w=G.deck[G.i];
  G.results.push({w,ok});
  used[G.key].add(w);
  G.phase="flash"; needNeutral=true;
  const g=$("game"); g.classList.add(ok?"good":"passed");
  showWord(ok?t("correct"):t("pass"));
  $("gscore").textContent=G.results.filter(r=>r.ok).length;
  if(ok){beep(784,.1,"sine",.2);setTimeout(()=>beep(1175,.16,"sine",.2),90);buzz(60)}else{beep(220,.22,"triangle",.2);buzz([30,40,30])}
  setTimeout(()=>{
    if(!G||G.phase!=="flash") return;
    g.classList.remove("good","passed");
    if(Date.now()>=G.endAt){finish();return}
    G.phase="play"; next();
  },750);
}
function cleanupGame(){
  if(!G) return;
  clearInterval(G.tick); clearTimeout(G.cd);
  $("game").classList.remove("good","passed");
  wakeOff();
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}
function finish(){
  if(!G||G.phase==="over") return;
  G.phase="over"; cleanupGame();
  beep(330,.5,"sawtooth",.12); buzz(300);
  const r=G.results, n=r.filter(x=>x.ok).length;
  $("game").hidden=true; $("results").hidden=false;
  $("rscore").textContent=n; $("rlabel").textContent=t("scoreLabel")+" · "+catName(G.id);
  const ch=$("chips"); ch.textContent="";
  r.forEach(x=>{const s=document.createElement("span");s.className="chip "+(x.ok?"ok":"no");s.textContent=x.w;ch.appendChild(s)});
  if(!r.length){const s=document.createElement("span");s.className="chip no";s.textContent=t("timeUp");ch.appendChild(s)}
  renderText();
  window.scrollTo(0,0);
}
function quit(){ cleanupGame(); G=null; $("game").hidden=true; $("results").hidden=true; $("home").hidden=false; renderHome(); }

$("zGood").addEventListener("click",()=>mark(true));
$("zPass").addEventListener("click",()=>mark(false));
$("quit").addEventListener("click",quit);
$("again").addEventListener("click",()=>{const id=G&&G.id;G=null;start(id||"mix")});
$("back").addEventListener("click",quit);

renderHome();
</script>
