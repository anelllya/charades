<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17142B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Charades Free">
<title>Charades Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HOME -->
<main id="home" class="wrap">
  <div class="brand"><h1>Charades</h1><span class="stamp">FREE</span></div>
  <p class="tag" data-t="tagline"></p>

  <div class="settings">
    <div class="set"><span data-t="lang"></span>
      <div class="seg" id="segLang"><button data-v="en">English</button><button data-v="es">Español</button></div></div>
    <div class="set"><span data-t="round"></span>
      <div class="seg" id="segTime"><button data-v="30">30s</button><button data-v="60">60s</button><button data-v="90">90s</button></div></div>
    <div class="set"><span data-t="controls"></span>
      <div class="seg" id="segCtl"><button data-v="tilt" data-t="tilt"></button><button data-v="tap" data-t="tap"></button></div></div>
    <div class="set"><span data-t="who"></span>
      <div class="seg" id="segKids"><button data-v="all" data-t="everyone"></button><button data-v="kids" data-t="kidsOnly"></button></div></div>
  </div>

  <div class="sectionhead"><h2 data-t="pick"></h2><small id="count"></small></div>
  <div class="grid" id="grid"></div>

  <p class="foot" data-t="foot"></p>
</main>

<!-- GAME -->
<section id="game" class="game" hidden>
  <div class="zones" id="zones"><button id="zPass" aria-label="Pass"></button><button id="zGood" aria-label="Correct"></button></div>
  <div class="hud">
    <div class="time" id="time">60</div>
    <div class="cat" id="gcat"></div>
    <div class="right"><div class="score" id="gscore">0</div><button class="quit" id="quit" aria-label="Quit">✕</button></div>
  </div>
  <p class="notice" id="notice" hidden></p>
  <div class="stage" id="stage"><div class="word" id="word"></div></div>
  <div class="hint" id="hint"></div>
</section>

<!-- RESULTS -->
<main id="results" class="wrap" hidden>
  <div class="score-big"><b id="rscore">0</b><span id="rlabel"></span></div>
  <div class="chips" id="chips"></div>
  <div class="actions">
    <button class="btn" id="again" data-t="again"></button>
    <button class="btn alt" id="back" data-t="cats"></button>
  </div>
</main>

<!-- CUSTOM WORDS -->
<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <h3 data-t="customTitle"></h3>
    <p data-t="customDesc"></p>
    <textarea id="customText" spellcheck="false"></textarea>
    <div class="actions"><button class="btn" id="saveCustom" data-t="save"></button><button class="btn alt" id="cancelCustom" data-t="cancel"></button></div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
